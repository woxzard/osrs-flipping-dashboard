# The checks every PR must pass (docs/workflow.md → "What GitHub does by
# itself"). The job name "checks" is the required status check.
#
# It calls the standard make targets (see the Makefile). The stack-specific
# parts are the Node setup and the test browser for the end-to-end checks.
name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }

      - name: Install
        run: make setup

      - name: Lint, format and unit tests
        run: make check

      - name: Build
        run: make build

      - name: Which optional steps does this project have?
        id: has
        run: |
          for target in e2e; do
            # A target that is still "todo" counts as missing.
            if grep -qE "^${target}:" Makefile && ! grep -qE "^${target}: todo\s*$" Makefile; then
              echo "${target//-/_}=true" >> "$GITHUB_OUTPUT"
            fi
          done

      # Cloud sessions have Chromium pre-installed; GitHub's runners don't.
      - name: Install the test browser
        if: steps.has.outputs.e2e == 'true'
        run: npx playwright install --with-deps chromium

      - name: End-to-end checks
        if: steps.has.outputs.e2e == 'true'
        run: make e2e

      - name: Keep the end-to-end report
        if: failure() && steps.has.outputs.e2e == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            test-results/
            playwright-report/
            e2e-report/
          if-no-files-found: ignore
          retention-days: 7
